name: 相場自動取得(鐘栄商店)

# 平日(月〜金)の日本時間 9:05〜18:05 に1時間ごとに実行(UTCでは0:05〜9:05)。
# サイトが昼に更新されても、1時間ほどでアプリに反映されます。
# 土日は動きがないので止めています(2026-10変更)。東京製鐵が土曜に出した価格表は月曜朝に取り込まれます。
# 急ぎのときは手動実行(Run workflow)もできます。
# ※公開リポジトリなのでGitHub Actionsは無料です。値が変わらない回は確認結果(souba-status.json)だけ更新します
on:
  schedule:
    - cron: '5 0-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: souba-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PDF読み取りライブラリを準備
        run: pip install pdfplumber

      - name: 鐘栄商店・東京製鐵から相場を取得
        run: python fetch_souba.py

      # 取得に失敗した回も、取れた分と「失敗した」という記録は保存する(if: always())
      - name: 変化があればコミット
        if: always()
        run: |
          git config user.name "souba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add souba-shouei.json souba-tokyotetsu.json souba-status.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "相場データ確認($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
