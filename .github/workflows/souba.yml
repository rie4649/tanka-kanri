name: 相場自動取得(鐘栄商店)

# 毎日(土日も)日本時間10:00と17:00に実行(UTCでは01:00と08:00)。
# 東京製鐵は土曜に価格表を出すことがあるため、土日も見に行きます。手動実行(Run workflow)もできます
on:
  schedule:
    - cron: '0 1,8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: souba-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PDF読み取りライブラリを準備
        run: pip install pdfplumber

      - name: 鐘栄商店・東京製鐵から相場を取得
        run: python fetch_souba.py

      - name: 変化があればコミット
        run: |
          git config user.name "souba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add souba-shouei.json souba-tokyotetsu.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "相場データ更新($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
            git push
          fi
