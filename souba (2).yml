name: 相場自動取得(鐘栄商店)

# 平日の日本時間12:30と17:30に実行(UTCでは03:30と08:30)。手動実行(Run workflow)もできます
on:
  schedule:
    - cron: '30 3 * * 1-5'
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: souba-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PDF読み取りライブラリを準備
        run: pip install pdfplumber

      - name: 鐘栄商店・東京製鐵から相場を取得
        run: python fetch_souba.py

      - name: 変化があればコミット
        run: |
          git config user.name "souba-bot"
          git config user.email "actions@users.noreply.github.com"
          git add souba-shouei.json souba-tokyotetsu.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "相場データ更新($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M'))"
            git push
          fi
