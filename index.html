<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>単価管理</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14532d">
<link rel="apple-touch-icon" href="./icon.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif; background:#f0f5f1; color:#1c2b21; padding-bottom:120px; }

  #lock { position:fixed; inset:0; background:linear-gradient(160deg,#14532d,#166534); z-index:999; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:20px; }
  #lock h1 { color:#fff; font-size:24px; letter-spacing:3px; }
  #lock input { width:100%; max-width:280px; padding:14px; font-size:18px; border:none; border-radius:12px; text-align:center; letter-spacing:2px; }
  #lock button { width:100%; max-width:280px; padding:14px; font-size:17px; font-weight:bold; border:none; border-radius:12px; background:#facc15; color:#14532d; }
  #pwErr { color:#fecaca; font-size:14px; min-height:20px; }

  header { background:linear-gradient(135deg,#14532d,#166534); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  header h1 { font-size:19px; letter-spacing:2px; }
  .hbtns { display:flex; gap:8px; }
  .hbtn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:8px; padding:6px 10px; font-size:12px; }

  .tabs { display:flex; background:#fff; border-bottom:2px solid #d8e4da; position:sticky; top:52px; z-index:49; }
  .tab { flex:1; text-align:center; padding:12px 0; font-size:15px; font-weight:bold; color:#7a8b7f; border-bottom:3px solid transparent; }
  .tab.act { color:#166534; border-bottom-color:#16a34a; }

  .page { display:none; padding:12px; }
  .page.act { display:block; }

  .alertBar { display:none; background:#fef2f2; border:1.5px solid #fca5a5; color:#b91c1c; border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.7; margin-bottom:10px; font-weight:bold; }

  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; -webkit-overflow-scrolling:touch; }
  .chip { flex:0 0 auto; background:#fff; border:1.5px solid #b9ccbc; color:#3c5543; border-radius:20px; padding:8px 16px; font-size:14px; font-weight:bold; white-space:nowrap; }
  .chip.act { background:#166534; border-color:#166534; color:#fff; }

  .toolRow { display:flex; gap:8px; margin-bottom:10px; }
  .searchBox { flex:1; padding:11px 14px; font-size:16px; border:1.5px solid #b9ccbc; border-radius:10px; background:#fff; min-width:0; }
  .searchBox:focus { outline:none; border-color:#16a34a; }
  .toolBtn { flex:0 0 auto; background:#fff; border:1.5px solid #b9ccbc; border-radius:10px; padding:0 13px; font-size:15px; color:#3c5543; font-weight:bold; }
  .toolBtn.act { background:#166534; border-color:#166534; color:#fff; }

  .meta { font-size:12px; color:#6b7f70; margin-bottom:8px; padding-left:2px; }

  .row { display:flex; align-items:center; gap:8px; background:#fff; border-radius:10px; padding:8px 10px; margin-bottom:6px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .row.today { background:#f0fdf4; }
  .iname { flex:1; text-align:left; background:none; border:none; font-size:15px; color:#1c2b21; padding:4px 0; min-width:0; word-break:break-all; line-height:1.4; }
  .sub { display:block; font-size:11px; color:#8a9b8f; }
  .sub .lk { color:#0e7490; }
  .sub .up { color:#c0392b; font-weight:bold; }
  .sub .down { color:#1d4ed8; font-weight:bold; }
  .todayBadge { display:inline-block; background:#16a34a; color:#fff; font-size:10px; border-radius:4px; padding:1px 5px; margin-left:4px; vertical-align:middle; }
  .price { width:110px; padding:10px 8px; font-size:17px; text-align:right; border:1.5px solid #cfdcd2; border-radius:8px; background:#fafdfb; }
  .price:focus { outline:none; border-color:#16a34a; }
  .price.chg { background:#fff7d6; border-color:#eab308; font-weight:bold; }
  .price.lkIn { background:#ecfeff; border-color:#a5f3fc; color:#155e75; }
  .yen { font-size:12px; color:#6b7f70; }

  .tblWrap { overflow-x:auto; background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); -webkit-overflow-scrolling:touch; }
  table.ttable { border-collapse:collapse; min-width:100%; font-size:13px; }
  .ttable th, .ttable td { border:1px solid #d8e4da; padding:8px 9px; text-align:right; white-space:nowrap; }
  .ttable th { background:#e8f2ea; color:#166534; font-size:12px; text-align:center; }
  .ttable td.nm, .ttable th.nm { position:sticky; left:0; background:#fff; text-align:left; font-weight:bold; max-width:140px; overflow:hidden; text-overflow:ellipsis; box-shadow:1px 0 0 #d8e4da; }
  .ttable th.nm { background:#e8f2ea; z-index:2; }
  .ttable td.latest { background:#f0fdf4; font-weight:bold; }
  .ttable td .cup { color:#c0392b; font-size:10px; display:block; }
  .ttable td .cdown { color:#1d4ed8; font-size:10px; display:block; }

  .saveBar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid #d8e4da; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:none; z-index:60; }
  .saveBar.show { display:block; }
  .saveDateRow { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .saveDateRow label { font-size:13px; color:#6b7f70; font-weight:bold; white-space:nowrap; }
  .saveDateRow input { flex:1; padding:8px; font-size:15px; border:1.5px solid #cfdcd2; border-radius:8px; background:#fff; }
  .saveBtn { width:100%; background:#16a34a; color:#fff; border:none; border-radius:12px; padding:15px; font-size:17px; font-weight:bold; box-shadow:0 3px 8px rgba(22,163,74,.4); }
  .saveBtn:disabled { background:#a8c4b0; box-shadow:none; }

  .subTabs { display:flex; gap:8px; margin-bottom:12px; }
  .subTab { flex:1; text-align:center; padding:11px 0; font-size:14px; font-weight:bold; border-radius:10px; background:#fff; border:1.5px solid #b9ccbc; color:#3c5543; }
  .subTab.act { background:#166534; border-color:#166534; color:#fff; }
  .setPane { display:none; }
  .setPane.act { display:block; }

  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
  .card h2 { font-size:15px; color:#166534; margin-bottom:10px; border-left:4px solid #16a34a; padding-left:8px; }
  .inline { display:flex; gap:8px; margin-bottom:8px; }
  .inline input, .inline select { flex:1; padding:10px; font-size:15px; border:1.5px solid #cfdcd2; border-radius:8px; min-width:0; background:#fff; }
  .addBtn { background:#166534; color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:bold; white-space:nowrap; }
  textarea.bulk { width:100%; height:110px; padding:10px; font-size:14px; border:1.5px solid #cfdcd2; border-radius:8px; margin-bottom:8px; }
  .note { font-size:11px; color:#6b7f70; margin-bottom:8px; line-height:1.6; }
  .tagList { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { background:#e8f2ea; border-radius:6px; padding:6px 8px; font-size:13px; display:flex; align-items:center; gap:6px; }
  .tag button { background:none; border:none; color:#c0392b; font-size:15px; font-weight:bold; padding:0 2px; }

  .setRow { display:flex; align-items:center; gap:6px; padding:8px 4px; border-bottom:1px solid #edf3ee; }
  .setRow .sn { flex:1; font-size:14px; min-width:0; word-break:break-all; line-height:1.4; }
  .setRow .sn .lk { display:block; font-size:11px; color:#0e7490; }
  .miniBtn { background:#e0f2fe; border:1px solid #7dd3fc; color:#075985; border-radius:6px; padding:6px 9px; font-size:12px; font-weight:bold; white-space:nowrap; }
  .miniDel { background:none; border:none; color:#c0392b; font-size:17px; font-weight:bold; padding:0 6px; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; z-index:100; align-items:flex-end; }
  .overlay.show { display:flex; }
  .sheet { background:#fff; width:100%; max-height:80vh; border-radius:16px 16px 0 0; padding:16px; overflow-y:auto; }
  .sheet h3 { font-size:16px; color:#166534; margin-bottom:12px; }
  .histRow { display:flex; justify-content:space-between; padding:9px 4px; border-bottom:1px solid #edf3ee; font-size:14px; }
  .histRow .d { color:#6b7f70; font-size:13px; }
  .autoTag { color:#0e7490; font-size:11px; margin-right:4px; }
  .up { color:#c0392b; font-weight:bold; }
  .down { color:#1d4ed8; font-weight:bold; }
  .closeBtn { width:100%; margin-top:14px; background:#eef3ef; border:none; border-radius:10px; padding:13px; font-size:15px; color:#3c5543; font-weight:bold; }
  .dangerBtn { width:100%; margin-top:8px; background:#fef2f2; border:1px solid #fca5a5; border-radius:10px; padding:13px; font-size:15px; color:#b91c1c; font-weight:bold; }
  .primaryBtn { width:100%; margin-top:8px; background:#16a34a; border:none; border-radius:10px; padding:13px; font-size:15px; color:#fff; font-weight:bold; }
  canvas { width:100%; height:130px; margin-bottom:10px; }
  .field { margin-bottom:10px; }
  .field label { display:block; font-size:12px; color:#6b7f70; margin-bottom:4px; }
  .field select, .field input { width:100%; padding:10px; font-size:15px; border:1.5px solid #cfdcd2; border-radius:8px; background:#fff; }

  #toast { position:fixed; left:50%; bottom:130px; transform:translateX(-50%); background:#1c2b21; color:#fff; padding:11px 22px; border-radius:22px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:200; white-space:nowrap; }
  #toast.show { opacity:1; }
  .empty { text-align:center; color:#8a9b8f; padding:30px 0; font-size:14px; }

  #printArea { display:none; }
  @media print {
    body > *:not(#printArea) { display:none !important; }
    #printArea { display:block !important; }
    body { padding:0; background:#fff; }
    #printArea h2 { font-size:18px; margin-bottom:4px; }
    #printArea .pdate { font-size:12px; color:#555; margin-bottom:10px; }
    #printArea table { width:100%; border-collapse:collapse; font-size:11px; }
    #printArea th, #printArea td { border:1px solid #999; padding:4px 6px; text-align:left; }
    #printArea th { background:#e8f2ea; }
    #printArea td.num { text-align:right; }
  }
</style>
</head>
<body>

<div id="lock">
  <h1>💹 単価管理</h1>
  <input id="pw" type="password" placeholder="パスワード" onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">開く</button>
  <div id="pwErr"></div>
</div>

<header>
  <h1>💹 単価管理</h1>
  <div class="hbtns">
    <button class="hbtn" onclick="reloadAll()">🔄 再読込</button>
    <button class="hbtn" id="installBtn" style="display:none">📲 インストール</button>
  </div>
</header>

<div class="tabs">
  <div class="tab act" onclick="switchTab('souba')">📈 相場</div>
  <div class="tab" onclick="switchTab('client')">🏢 取引先</div>
  <div class="tab" onclick="switchTab('setting')">⚙️ 設定</div>
</div>

<!-- 相場 -->
<div class="page act" id="page-souba">
  <div class="alertBar" id="soubaAlert"></div>
  <div class="chips" id="soubaChips"></div>
  <div class="toolRow">
    <input class="searchBox" id="soubaSearch" placeholder="🔍 品名で検索" oninput="renderList('souba')">
    <button class="toolBtn" id="tblBtn" onclick="toggleTable()">📋 表</button>
    <button class="toolBtn" onclick="printView('souba')">🖨️</button>
  </div>
  <div class="meta" id="soubaMeta"></div>
  <div id="soubaList"></div>
</div>

<!-- 取引先 -->
<div class="page" id="page-client">
  <div class="chips" id="clientChips"></div>
  <div class="toolRow">
    <input class="searchBox" id="clientSearch" placeholder="🔍 品名で検索" oninput="renderList('client')">
    <button class="toolBtn" onclick="printView('client')">🖨️</button>
  </div>
  <div class="meta" id="clientMeta"></div>
  <div id="clientList"></div>
</div>

<!-- 設定 -->
<div class="page" id="page-setting">
  <div class="subTabs">
    <button class="subTab act" id="st-souba" onclick="switchSetPane('souba')">📈 相場系</button>
    <button class="subTab" id="st-client" onclick="switchSetPane('client')">🏢 引取先</button>
  </div>

  <div class="setPane act" id="pane-souba">
    <div class="card">
      <h2>相場の会社</h2>
      <div class="inline"><input id="newCompany" placeholder="会社名"><button class="addBtn" onclick="addTarget('souba')">追加</button></div>
      <div class="tagList" id="companyTags"></div>
    </div>
    <div class="card">
      <h2>品名の登録</h2>
      <div class="inline"><select id="setCompanySel" onchange="renderSettingItems('souba')"></select></div>
      <div class="inline"><input id="newSoubaItem" placeholder="品名"><input id="newSoubaPrice" type="number" inputmode="decimal" placeholder="単価(任意)" style="max-width:110px"><button class="addBtn" onclick="addItem('souba')">追加</button></div>
      <div class="note">まとめて登録:1行に1品名。「品名,単価」の形式もOK(単価は省略可)</div>
      <textarea class="bulk" id="bulkSouba" placeholder="銅型,2132&#10;2号銅,2072&#10;上銅新切"></textarea>
      <button class="addBtn" style="width:100%" onclick="bulkAdd('souba')">一括登録</button>
      <div class="tagList" id="soubaItemTags" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2>変動アラート</h2>
      <div class="note">1回の更新でこの金額以上動いた品目を、相場タブの上に赤く表示します</div>
      <div class="inline"><input id="alertDiffInput" type="number" inputmode="decimal" placeholder="50"><span style="align-self:center;font-size:13px">円以上</span><button class="addBtn" onclick="saveAlertDiff()">保存</button></div>
    </div>
    <div class="card">
      <h2>CSVエクスポート</h2>
      <div class="note">Excelでそのまま開けるCSVファイルをダウンロードします</div>
      <button class="addBtn" style="width:100%;margin-bottom:8px" onclick="exportHistoryCSV()">📥 単価履歴をCSV出力(全件)</button>
      <button class="addBtn" style="width:100%" onclick="exportCurrentCSV()">📥 現在単価一覧をCSV出力</button>
    </div>
  </div>

  <div class="setPane" id="pane-client">
    <div class="card">
      <h2>取引先</h2>
      <div class="inline"><input id="newClient" placeholder="取引先名"><button class="addBtn" onclick="addTarget('client')">追加</button></div>
      <div class="tagList" id="clientTags"></div>
    </div>
    <div class="card">
      <h2>品目の登録・相場との連動</h2>
      <div class="inline"><select id="setClientSel" onchange="renderSettingItems('client')"></select></div>
      <div class="inline"><input id="newClientItem" placeholder="品名"><input id="newClientPrice" type="number" inputmode="decimal" placeholder="単価(任意)" style="max-width:110px"><button class="addBtn" onclick="addItem('client')">追加</button></div>
      <div class="note">まとめて登録:1行に1品名。「品名,単価」の形式もOK<br>🔗連動を設定した品目は、相場を保存すると自動で「相場±円」に更新されます</div>
      <textarea class="bulk" id="bulkClient"></textarea>
      <button class="addBtn" style="width:100%" onclick="bulkAdd('client')">一括登録</button>
      <div id="clientItemTags" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<div class="saveBar" id="saveBar">
  <div class="saveDateRow"><label>📅 適用日</label><input type="date" id="saveDate"></div>
  <button class="saveBtn" id="saveBtn" onclick="saveChanges()">保存</button>
</div>

<!-- 履歴 -->
<div class="overlay" id="histOverlay" onclick="if(event.target===this)closeHist()">
  <div class="sheet">
    <h3 id="histTitle"></h3>
    <canvas id="histChart" width="600" height="260" style="display:none"></canvas>
    <div id="histList"></div>
    <button class="closeBtn" onclick="closeHist()">閉じる</button>
  </div>
</div>

<!-- 連動設定 -->
<div class="overlay" id="linkOverlay" onclick="if(event.target===this)closeLink()">
  <div class="sheet">
    <h3 id="linkTitle">🔗 相場との連動</h3>
    <div class="field"><label>連動元の会社</label><select id="linkCompanySel" onchange="fillLinkItems()"></select></div>
    <div class="field"><label>連動元の品名</label><select id="linkItemSel"></select></div>
    <div class="field"><label>調整額(円)マイナスも入力できます(例: -70)</label><input id="linkAdj" type="number" inputmode="decimal" step="any" placeholder="0"></div>
    <div class="note" id="linkPreview"></div>
    <button class="primaryBtn" onclick="saveLink()">連動を設定</button>
    <button class="dangerBtn" id="linkRemoveBtn" onclick="removeLink()">連動を解除</button>
    <button class="closeBtn" onclick="closeLink()">閉じる</button>
  </div>
</div>

<div id="printArea"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const PASSCODE = 's2292';

const firebaseConfig = {
  apiKey: "AIzaSyD99Mx0MnGplSQjV7830bS7-gdCBSM9DGY",
  authDomain: "sekine-store.firebaseapp.com",
  projectId: "sekine-store",
  storageBucket: "sekine-store.firebasestorage.app",
  messagingSenderId: "781856496751",
  appId: "1:781856496751:web:e2e1e5de4cd803415a819a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const COL = { souba:'tankaCompanies', client:'tankaClientList' };
const DEFAULT_COMPANIES = ['産業新聞(非鉄)','産業新聞(鉄)','朝日工業','東京製鐵','花村産業','恒成','信越軽金属'];

const S = {
  tab:'souba',
  alertDiff:50,
  tableMode:false,
  tableCache:{},
  souba:{ list:[], currentId:null, edits:{} },
  client:{ list:[], currentId:null, edits:{} }
};
let linkEditing = null;

function unlock(){
  const v = document.getElementById('pw').value;
  if(v === PASSCODE){
    sessionStorage.setItem('tankaAuth','1');
    document.getElementById('lock').style.display='none';
  } else {
    document.getElementById('pwErr').textContent = 'パスワードが違います';
    document.getElementById('pw').value='';
  }
}
if(sessionStorage.getItem('tankaAuth')==='1') document.getElementById('lock').style.display='none';

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function fmtDate(ts){ const d=new Date(ts); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
function fmtMD(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtTime(ts){ const d=new Date(ts); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function isToday(ts){ return ts && fmtDate(ts)===fmtDate(Date.now()); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function round2(n){ return Math.round(n*100)/100; }
function diffTxt(it){
  if(it.p==null || it.pp==null) return null;
  const d = it.p - it.pp;
  if(d>0) return {cls:'up', txt:`▲+${round2(d)}`};
  if(d<0) return {cls:'down', txt:`▼${round2(d)}`};
  return {cls:'flat', txt:'±0'};
}
function compName(id){ const c=S.souba.list.find(x=>x.id===id); return c?c.name:'?'; }
function adjTxt(a){ a=a||0; return (a>=0?'+':'')+a+'円'; }
function getSaveTs(){
  const v = document.getElementById('saveDate').value;
  if(!v || v===todayStr()) return Date.now();
  const [y,m,d] = v.split('-').map(Number);
  return new Date(y, m-1, d, 12, 0, 0).getTime();
}

async function loadAll(){
  const cfg = await db.collection('tankaConfig').doc('main').get();
  if(cfg.exists && cfg.data().alertDiff!=null) S.alertDiff = cfg.data().alertDiff;

  const snap = await db.collection(COL.souba).orderBy('order').get();
  let list = snap.docs.map(d=>({id:d.id, ...d.data()}));
  const missing = DEFAULT_COMPANIES.filter(n=>!list.find(c=>c.name===n));
  if(missing.length){
    const batch = db.batch();
    let order = list.length ? Math.max(...list.map(c=>c.order||0))+1 : 0;
    missing.forEach(n=>{ batch.set(db.collection(COL.souba).doc(), {name:n, order:order++, items:[]}); });
    await batch.commit();
    return loadAll();
  }
  S.souba.list = list;
  if(!S.souba.currentId || !S.souba.list.find(c=>c.id===S.souba.currentId)) S.souba.currentId = S.souba.list[0]?.id || null;

  S.tableCache = {};
  renderAll();
}

async function buildTable(company){
  if(S.tableCache[company.id]) return S.tableCache[company.id];
  const snap = await db.collection('tankaHistory')
    .where('kind','==','souba').where('target','==',company.name).get();
  const rows = snap.docs.map(d=>d.data());
  const map = {};
  const dateTs = {};
  rows.forEach(r=>{
    const dk = fmtDate(r.ts);
    map[r.item] = map[r.item] || {};
    if(!map[r.item][dk] || r.ts > map[r.item][dk].ts) map[r.item][dk] = {ts:r.ts, price:r.newPrice};
    if(!dateTs[dk] || r.ts > dateTs[dk]) dateTs[dk] = r.ts;
  });
  const dates = Object.keys(dateTs).sort((a,b)=>dateTs[b]-dateTs[a]).slice(0,8);
  const result = {map, dates, dateTs};
  S.tableCache[company.id] = result;
  return result;
}
async function renderTable(target, box){
  box.innerHTML = '<div class="empty">読み込み中…</div>';
  const {map, dates, dateTs} = await buildTable(target);
  if(!dates.length){ box.innerHTML = '<div class="empty">まだ単価の記録がありません。入力画面(📝)で単価を入れて保存すると表ができていきます</div>'; return; }
  const q = document.getElementById('soubaSearch').value.trim();
  let body = '';
  (target.items||[]).forEach(it=>{
    if(q && !it.n.includes(q)) return;
    let tds = '';
    dates.forEach((dk,di)=>{
      const cell = map[it.n]?.[dk];
      let sub = '';
      if(cell){
        for(let j=di+1; j<dates.length; j++){
          const prev = map[it.n]?.[dates[j]];
          if(prev){
            const d = round2(cell.price - prev.price);
            if(d>0) sub = `<span class="cup">▲+${d}</span>`;
            else if(d<0) sub = `<span class="cdown">▼${d}</span>`;
            break;
          }
        }
      }
      tds += `<td class="${di===0?'latest':''}">${cell?cell.price:''}${sub}</td>`;
    });
    body += `<tr><td class="nm">${esc(it.n)}</td>${tds}</tr>`;
  });
  if(!body){ box.innerHTML = '<div class="empty">該当する品名がありません</div>'; return; }
  box.innerHTML = `<div class="tblWrap"><table class="ttable">
    <tr><th class="nm">品名</th>${dates.map(dk=>`<th>${fmtMD(dateTs[dk])}</th>`).join('')}</tr>
    ${body}
  </table></div>`;
}

async function saveChanges(){
  const kind = S.tab;
  const st = S[kind];
  const target = st.list.find(c=>c.id===st.currentId);
  const keys = Object.keys(st.edits);
  if(!target || !keys.length) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent='保存中…';
  try{
    const now = getSaveTs();
    const newItems = target.items.map((it,idx)=> st.edits.hasOwnProperty(idx) ? {...it, pp:(it.p!=null?it.p:it.pp??null), p:st.edits[idx], t:now} : it);

    let linkedUpdates = [];
    if(kind==='souba'){
      const changedMap = {};
      keys.forEach(k=>{ changedMap[target.items[+k].n] = st.edits[k]; });
      S.client.list.forEach(cl=>{
        let touched = 0;
        const hist = [];
        const items = (cl.items||[]).map(it=>{
          if(it.link && it.link.cid===target.id && changedMap.hasOwnProperty(it.link.item)){
            const np = round2(changedMap[it.link.item] + (it.link.adj||0));
            if(np !== it.p){
              touched++;
              hist.push({kind:'client', target:cl.name, item:it.n, oldPrice:it.p??null, newPrice:np, ts:now, auto:true});
              return {...it, pp:(it.p!=null?it.p:it.pp??null), p:np, t:now};
            }
          }
          return it;
        });
        if(touched) linkedUpdates.push({cl, items, hist, touched});
      });
      if(linkedUpdates.length){
        const total = linkedUpdates.reduce((s,u)=>s+u.touched,0);
        const names = linkedUpdates.map(u=>u.cl.name).join('、');
        if(!confirm(`🔗連動している取引先単価 ${total}件(${names})も一緒に更新します。\n\nOK = 一緒に更新\nキャンセル = 相場だけ保存`)) linkedUpdates = [];
      }
    }

    const batch = db.batch();
    const upd = {items:newItems};
    if(kind==='client') upd.lastUpdated = now;
    batch.update(db.collection(COL[kind]).doc(target.id), upd);
    keys.forEach(k=>{
      const idx=+k;
      batch.set(db.collection('tankaHistory').doc(), {
        kind, target: target.name, item: target.items[idx].n,
        oldPrice: target.items[idx].p ?? null, newPrice: st.edits[k], ts: now
      });
    });
    linkedUpdates.forEach(u=>{
      batch.update(db.collection(COL.client).doc(u.cl.id), {items:u.items, lastUpdated:now});
      u.hist.forEach(h=> batch.set(db.collection('tankaHistory').doc(), h));
    });
    await batch.commit();

    target.items = newItems;
    if(kind==='client') target.lastUpdated = now;
    linkedUpdates.forEach(u=>{ u.cl.items = u.items; u.cl.lastUpdated = now; });
    st.edits = {};
    S.tableCache = {};
    renderList('souba'); renderList('client'); renderAlertBar(); updateSaveBar();
    const linkedCount = linkedUpdates.reduce((s,u)=>s+u.touched,0);
    toast(`✅ ${fmtDate(now)}付で${keys.length}件保存しました` + (linkedCount?`(連動${linkedCount}件も更新)`:''));
  }catch(e){
    console.error(e); toast('❌ 保存に失敗しました');
    btn.disabled=false; updateSaveBar();
  }
}

function drawChart(vals){
  const cv = document.getElementById('histChart');
  cv.style.display='block';
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const min=Math.min(...vals), max=Math.max(...vals), pad=30;
  const W=cv.width, H=cv.height;
  const x=i=> pad + (W-pad*2)*(vals.length===1?0.5:i/(vals.length-1));
  const y=v=> max===min ? H/2 : (H-pad) - (H-pad*2)*((v-min)/(max-min));
  ctx.strokeStyle='#16a34a'; ctx.lineWidth=3; ctx.beginPath();
  vals.forEach((v,i)=> i? ctx.lineTo(x(i),y(v)) : ctx.moveTo(x(i),y(v)));
  ctx.stroke();
  ctx.fillStyle='#166534';
  vals.forEach((v,i)=>{ ctx.beginPath(); ctx.arc(x(i),y(v),4,0,7); ctx.fill(); });
  ctx.fillStyle='#6b7f70'; ctx.font='20px sans-serif';
  ctx.fillText(max, 4, y(max)+6); ctx.fillText(min, 4, y(min)+6);
}

function csvCell(v){
  if(v==null) v='';
  v = String(v);
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

    if(np !== it.p){
      nit = {...nit, pp:(it.p!=null?it.p:it.pp??null), p:np, t:now};
      hist = {kind:'client', target:client.name, item:it.n, oldPrice:it.p??null, newPrice:np, ts:now, auto:true};
    }
  }
  items[idx] = nit;
  const batch = db.batch();
  batch.update(db.collection(COL.client).doc(client.id), {items, lastUpdated:now});
  if(hist) batch.set(db.collection('tankaHistory').doc(), hist);
  await batch.commit();
  closeLink();
  await loadAll();
  toast('🔗 連動を設定しました');
}
async function removeLink(){
  if(!linkEditing) return;
  const client = S.client.list.find(c=>c.id===linkEditing.clientId);
  const idx = linkEditing.idx;
  if(!confirm('連動を解除しますか?(単価は今のまま残り、手入力に戻ります)')) return;
  const items = [...client.items];
  const {link, ...rest} = items[idx];
  items[idx] = rest;
  await db.collection(COL.client).doc(client.id).update({items});
  closeLink();
  await loadAll();
  toast('連動を解除しました');
}
function closeLink(){ document.getElementById('linkOverlay').classList.remove('show'); linkEditing=null; }

function renderSettings(){
  document.getElementById('alertDiffInput').value = S.alertDiff;
  document.getElementById('companyTags').innerHTML = S.souba.list.map(c=>`<span class="tag">${esc(c.name)}<button onclick="delTarget('souba','${c.id}')">×</button></span>`).join('');
  document.getElementById('clientTags').innerHTML = S.client.list.map(c=>`<span class="tag">${esc(c.name)}<button onclick="delTarget('client','${c.id}')">×</button></span>`).join('') || '<div class="note">まだ登録がありません</div>';
  ['souba','client'].forEach(kind=>{
    const sel = document.getElementById(kind==='souba'?'setCompanySel':'setClientSel');
    const cur = sel.value;
    sel.innerHTML = S[kind].list.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
    if(cur && S[kind].list.find(c=>c.id===cur)) sel.value=cur;
    renderSettingItems(kind);
  });
}
function renderSettingItems(kind){
  const sel = document.getElementById(kind==='souba'?'setCompanySel':'setClientSel');
  const target = S[kind].list.find(c=>c.id===sel.value);
  if(kind==='souba'){
    const box = document.getElementById('soubaItemTags');
    if(!target){ box.innerHTML=''; return; }
    box.innerHTML = (target.items||[]).map((it,idx)=>`<span class="tag">${esc(it.n)}<button onclick="delItem('souba',${idx})">×</button></span>`).join('') || '<div class="note">まだ品名がありません</div>';
  } else {
    const box = document.getElementById('clientItemTags');
    if(!target){ box.innerHTML=''; return; }
    box.innerHTML = (target.items||[]).map((it,idx)=>`<div class="setRow">
      <span class="sn">${esc(it.n)}${it.link?`<span class="lk">🔗 ${esc(compName(it.link.cid))}/${esc(it.link.item)} ${adjTxt(it.link.adj)}</span>`:''}</span>
      <button class="miniBtn" onclick="openLink(${idx})">${it.link?'連動変更':'連動'}</button>
      <button class="miniDel" onclick="delItem('client',${idx})">×</button>
    </div>`).join('') || '<div class="note">まだ品名がありません</div>';
  }
}
async function addTarget(kind){
  const inp = document.getElementById(kind==='souba'?'newCompany':'newClient');
  const name = inp.value.trim();
  if(!name) return;
  if(S[kind].list.find(c=>c.name===name)){ toast('同じ名前がすでにあります'); return; }
  const order = S[kind].list.length ? Math.max(...S[kind].list.map(c=>c.order||0))+1 : 0;
  await db.collection(COL[kind]).add({name, order, items:[]});
  inp.value='';
  await loadAll(); toast(`「${name}」を追加しました`);
}
async function delTarget(kind,id){
  const t = S[kind].list.find(c=>c.id===id);
  if(!t) return;
  if(!confirm(`「${t.name}」を削除しますか?\n(登録した品名・単価も見えなくなります)`)) return;
  await db.collection(COL[kind]).doc(id).delete();
  await loadAll(); toast('削除しました');
}
async function addItem(kind){
  const sel = document.getElementById(kind==='souba'?'setCompanySel':'setClientSel');
  const nameInp = document.getElementById(kind==='souba'?'newSoubaItem':'newClientItem');
  const priceInp = document.getElementById(kind==='souba'?'newSoubaPrice':'newClientPrice');
  const target = S[kind].list.find(c=>c.id===sel.value);
  const name = nameInp.value.trim();
  if(!target || !name) return;
  if((target.items||[]).find(it=>it.n===name)){ toast('同じ品名がすでにあります'); return; }
  const p = priceInp.value===''? null : parseFloat(priceInp.value);
  const ok = p!=null && !isNaN(p);
  const items = [...(target.items||[]), {n:name, p:ok?p:null, pp:null, t:ok?Date.now():null}];
  await db.collection(COL[kind]).doc(target.id).update({items});
  nameInp.value=''; priceInp.value='';
  await loadAll(); toast(`「${name}」を追加しました`);
}
async function bulkAdd(kind){
  const sel = document.getElementById(kind==='souba'?'setCompanySel':'setClientSel');
  const ta = document.getElementById(kind==='souba'?'bulkSouba':'bulkClient');
  const target = S[kind].list.find(c=>c.id===sel.value);
  if(!target) return;
  const lines = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return;
  const items = [...(target.items||[])];
  let added=0, skipped=0;
  lines.forEach(line=>{
    const parts = line.split(/[,、\t]/).map(s=>s.trim());
    const name = parts[0];
    if(!name) return;
    if(items.find(it=>it.n===name)){ skipped++; return; }
    const p = parts[1]!==undefined && parts[1]!=='' ? parseFloat(parts[1]) : null;
    const ok = p!=null && !isNaN(p);
    items.push({n:name, p:ok?p:null, pp:null, t:ok?Date.now():null});
    added++;
  });
  if(!added){ toast('追加できる品名がありませんでした'); return; }
  await db.collection(COL[kind]).doc(target.id).update({items});
  ta.value='';
  await loadAll();
  toast(`${added}件追加しました` + (skipped?`(重複${skipped}件はスキップ)`:''));
}
async function delItem(kind, idx){
  const sel = document.getElementById(kind==='souba'?'setCompanySel':'setClientSel');
  const target = S[kind].list.find(c=>c.id===sel.value);
  if(!target) return;
  const it = target.items[idx];
  if(!confirm(`「${it.n}」を削除しますか?`)) return;
  const items = target.items.filter((_,i)=>i!==idx);
  await db.collection(COL[kind]).doc(target.id).update({items});
  await loadAll(); toast('削除しました');
}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('installBtn').style.display='block';
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('installBtn').style.display='none';
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

loadAll();
</script>
