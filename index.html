<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>単価管理</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14532d">
<link rel="apple-touch-icon" href="./icon.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif; background:#f0f5f1; color:#1c2b21; padding-bottom:90px; }

  #lock { position:fixed; inset:0; background:linear-gradient(160deg,#14532d,#166534); z-index:999; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:20px; }
  #lock h1 { color:#fff; font-size:24px; letter-spacing:3px; }
  #lock input { width:100%; max-width:280px; padding:14px; font-size:18px; border:none; border-radius:12px; text-align:center; letter-spacing:2px; }
  #lock button { width:100%; max-width:280px; padding:14px; font-size:17px; font-weight:bold; border:none; border-radius:12px; background:#facc15; color:#14532d; }
  #pwErr { color:#fecaca; font-size:14px; min-height:20px; }

  header { background:linear-gradient(135deg,#14532d,#166534); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  header h1 { font-size:19px; letter-spacing:2px; }
  .hbtns { display:flex; gap:8px; }
  .hbtn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:8px; padding:6px 10px; font-size:12px; }

  .tabs { display:flex; background:#fff; border-bottom:2px solid #d8e4da; position:sticky; top:52px; z-index:49; }
  .tab { flex:1; text-align:center; padding:12px 0; font-size:15px; font-weight:bold; color:#7a8b7f; border-bottom:3px solid transparent; }
  .tab.act { color:#166534; border-bottom-color:#16a34a; }

  .page { display:none; padding:12px; }
  .page.act { display:block; }

  .alertBar { display:none; background:#fef2f2; border:1.5px solid #fca5a5; color:#b91c1c; border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.7; margin-bottom:10px; font-weight:bold; }

  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; -webkit-overflow-scrolling:touch; }
  .chip { flex:0 0 auto; background:#fff; border:1.5px solid #b9ccbc; color:#3c5543; border-radius:20px; padding:8px 16px; font-size:14px; font-weight:bold; white-space:nowrap; }
  .chip.act { background:#166534; border-color:#166534; color:#fff; }

  .toolRow { display:flex; gap:8px; margin-bottom:10px; }
  .searchBox { flex:1; padding:11px 14px; font-size:16px; border:1.5px solid #b9ccbc; border-radius:10px; background:#fff; min-width:0; }
  .searchBox:focus { outline:none; border-color:#16a34a; }
  .toolBtn { flex:0 0 auto; background:#fff; border:1.5px solid #b9ccbc; border-radius:10px; padding:0 13px; font-size:15px; color:#3c5543; font-weight:bold; }
  .toolBtn.act { background:#166534; border-color:#166534; color:#fff; }

  .meta { font-size:12px; color:#6b7f70; margin-bottom:8px; padding-left:2px; }

  .row { display:flex; align-items:center; gap:6px; background:#fff; border-radius:10px; padding:8px 8px; margin-bottom:6px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .row.today { background:#f0fdf4; }
  .iname { flex:1; text-align:left; background:none; border:none; font-size:15px; color:#1c2b21; padding:4px 0; min-width:0; word-break:break-all; line-height:1.4; }
  .sub { display:block; font-size:11px; color:#8a9b8f; }
  .sub .lk { color:#0e7490; }
  .sub .up { color:#c0392b; font-weight:bold; }
  .sub .down { color:#1d4ed8; font-weight:bold; }
  .todayBadge { display:inline-block; background:#16a34a; color:#fff; font-size:10px; border-radius:4px; padding:1px 5px; margin-left:4px; vertical-align:middle; }
  .step { flex:0 0 auto; width:38px; height:40px; border-radius:8px; border:1.5px solid #cfdcd2; background:#fff; font-size:19px; font-weight:bold; color:#166534; }
  .step:active { background:#e8f2ea; }
  .price { width:86px; padding:9px 6px; font-size:17px; text-align:right; border:1.5px solid #cfdcd2; border-radius:8px; background:#fafdfb; }
  .price:focus { outline:none; border-color:#16a34a; }
  .price.chg { background:#fff7d6; border-color:#eab308; font-weight:bold; }
  .price.lkIn { background:#ecfeff; border-color:#a5f3fc; color:#155e75; }

  /* 表モード */
  .tblWrap { overflow-x:auto; background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); -webkit-overflow-scrolling:touch; }
  table.ttable { border-collapse:collapse; min-width:100%; font-size:13px; }
  .ttable th, .ttable td { border:1px solid #d8e4da; padding:8px 9px; text-align:right; white-space:nowrap; }
  .ttable th { background:#e8f2ea; color:#166534; font-size:12px; text-align:center; }
  .ttable td.nm, .ttable th.nm { position:sticky; left:0; background:#fff; text-align:left; font-weight:bold; max-width:140px; overflow:hidden; text-overflow:ellipsis; box-shadow:1px 0 0 #d8e4da; }
  .ttable th.nm { background:#e8f2ea; z-index:2; }
  .ttable td.latest { background:#f0fdf4; font-weight:bold; }
  .ttable td .cup { color:#c0392b; font-size:10px; display:block; }
  .ttable td .cdown { color:#1d4ed8; font-size:10px; display:block; }

  .saveBar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid #d8e4da; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:none; z-index:60; }
  .saveBar.show { display:block; }
  .saveBtn { width:100%; background:#16a34a; color:#fff; border:none; border-radius:12px; padding:15px; font-size:17px; font-weight:bold; box-shadow:0 3px 8px rgba(22,163,74,.4); }
  .saveBtn:disabled { background:#a8c4b0; box-shadow:none; }

  .subTabs { display:flex; gap:8px; margin-bottom:12px; }
  .subTab { flex:1; text-align:center; padding:11px 0; font-size:14px; font-weight:bold; border-radius:10px; background:#fff; border:1.5px solid #b9ccbc; color:#3c5543; }
  .subTab.act { background:#166534; border-color:#166534; color:#fff; }
  .setPane { display:none; }
  .setPane.act { display:block; }

  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.07); }
  .card h2 { font-size:15px; color:#166534; margin-bottom:10px; border-left:4px solid #16a34a; padding-left:8px; }
  .inline { display:flex; gap:8px; margin-bottom:8px; }
  .inline input, .inline select { flex:1; padding:10px; font-size:15px; border:1.5px solid #cfdcd2; border-radius:8px; min-width:0; background:#fff; }
  .addBtn { background:#166534; color:#fff; border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:bold; white-space:nowrap; }
  textarea.bulk { width:100%; height:110px; padding:10px; font-size:14px; border:1.5px solid #cfdcd2; border-radius:8px; margin-bottom:8px; }
  .note { font-size:11px; color:#6b7f70; margin-bottom:8px; line-height:1.6; }
  .tagList { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { background:#e8f2ea; border-radius:6px; padding:6px 8px; font-size:13px; display:flex; align-items:center; gap:6px; }
  .tag button { background:none; border:none; color:#c0392b; font-size:15px; font-weight:bold; padding:0 2px; }

  .setRow { display:flex; align-items:center; gap:6px; padding:8px 4px; border-bottom:1px solid #edf3ee; }
  .setRow .sn { flex:1; font-size:14px; min-width:0; word-break:break-all; line-height:1.4; }
  .setRow .sn .lk { display:block; font-size:11px; color:#0e7490; }
  .miniBtn { background:#e0f2fe; border:1px solid #7dd3fc; color:#075985; border-radius:6px; padding:6px 9px; font-size:12px; font-weight:bold; white-space:nowrap; }
  .miniDel { background:none; border:none; color:#c0392b; font-size:17px; font-weight:bold; padding:0 6px; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; z-index:100; align-items:flex-end; }
  .overlay.show { display:flex; }
  .sheet { background:#fff; width:100%; max-height:80vh; border-radius:16px 16px 0 0; padding:16px; overflow-y:auto; }
  .sheet h3 { font-size:16px; color:#166534; margin-bottom:12px; }
  .histRow { display:flex; justify-content:space-between; padding:9px 4px; border-bottom:1px solid #edf3ee; font-size:14px; }
  .histRow .d { color:#6b7f70; font-size:13px; }
  .autoTag { color:#0e7490; font-size:11px; margin-right:4px; }
  .up { color:#c0392b; font-weight:bold; }
  .down { color:#1d4ed8; font-weight:bold; }
  .closeBtn { width:100%; margin-top:14px; background:#eef3ef; border:none; border-radius:10px; padding:13px; font-size:15px; color:#3c5543; font-weight:bold; }
  .dangerBtn { width:100%; margin-top:8px; background:#fef2f2; border:1px solid #fca5a5; border-radius:10px; padding:13px; font-size:15px; color:#b91c1c; font-weight:bold; }
  .primaryBtn { width:100%; margin-top:8px; background:#16a34a; border:none; border-radius:10px; padding:13px; font-size:15px; color:#fff; font-weight:bold; }
  canvas { width:100%; height:130px; margin-bottom:10px; }
  .field { margin-bottom:10px; }
  .field label { display:block; font-size:12px; color:#6b7f70; margin-bottom:4px; }
  .field select, .field input { width:100%; padding:10px; font-size:15px; border:1.5px solid #cfdcd2; border-radius:8px; background:#fff; }

  #toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:#1c2b21; color:#fff; padding:11px 22px; border-radius:22px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:200; white-space:nowrap; }
  #toast.show { opacity:1; }
  .empty { text-align:center; color:#8a9b8f; padding:30px 0; font-size:14px; }

  #printArea { display:none; }
  @media print {
    body > *:not(#printArea) { display:none !important; }
    #printArea { display:block !important; }
    body { padding:0; background:#fff; }
    #printArea h2 { font-size:18px; margin-bottom:4px; }
    #printArea .pdate { font-size:12px; color:#555; margin-bottom:10px; }
    #printArea table { width:100%; border-collapse:collapse; font-size:11px; }
    #printArea th, #printArea td { border:1px solid #999; padding:4px 6px; text-align:left; }
    #printArea th { background:#e8f2ea; }
    #printArea td.num { text-align:right; }
  }
</style>
</head>
<body>

<div id="lock">
  <h1>💹 単価管理</h1>
  <input id="pw" type="password" placeholder="パスワード" onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">開く</button>
  <div id="pwErr"></div>
</div>

<header>
  <h1>💹 単価管理</h1>
  <div class="hbtns">
    <button class="hbtn" onclick="reloadAll()">🔄 再読込</button>
    <button class="hbtn" id="installBtn" style="display:none">📲 インストール</button>
  </div>
</header>

<div class="tabs">
  <div class="tab act" onclick="switchTab('souba')">📈 相場</div>
  <div class="tab" onclick="switchTab('client')">🏢 取引先</div>
  <div class="tab" onclick="switchTab('setting')">⚙️ 設定</div>
</div>

<!-- 相場 -->
<div class="page act" id="page-souba">
  <div class="alertBar" id="soubaAlert"></div>
  <div class="chips" id="soubaChips"></div>
  <div class="toolRow">
    <input class="searchBox" id="soubaSearch" placeholder="🔍 品名で検索" oninput="renderList('souba')">
    <button class="toolBtn" id="tblBtn" onclick="toggleTable()">📋 表</button>
    <button class="toolBtn" onclick="openAdj()">±</button>
    <button class="toolBtn" onclick="printView('souba')">🖨️</button>
  </div>
  <div class="meta" id="soubaMeta"></div>
  <div id="soubaList"></div>
</div>

<!-- 取引先 -->
<div class="page" id="page-client">
  <div class="chips" id="clientChips"></div>
  <div class="toolRow">
    <input class="searchBox" id="clientSearch" placeholder="🔍 品名で検索" oninput="renderList('client')">
    <button class="toolBtn" onclick="openAdj()">±</button>
    <button class="toolBtn" onclick="printView('client')">🖨️</button>
  </div>
  <div class="meta" id="clientMeta"></div>
  <div id="clientList"></div>
</div>

<!-- 設定 -->
<div class="page" id="page-setting">
  <div class="subTabs">
    <button class="subTab act" id="st-souba" onclick="switchSetPane('souba')">📈 相場系</button>
    <button class="subTab" id="st-client" onclick="switchSetPane('client')">🏢 引取先</button>
  </div>

  <div class="setPane act" id="pane-souba">
    <div class="card">
      <h2>相場の会社</h2>
      <div class="inline"><input id="newCompany" placeholder="会社名"><button class="addBtn" onclick="addTarget('souba')">追加</button></div>
      <div class="tagList" id="companyTags"></div>
    </div>
    <div class="card">
      <h2>品名の登録</h2>
      <div class="inline"><select id="setCompanySel" onchange="renderSettingItems('souba')"></select></div>
      <div class="inline"><input id="newSoubaItem" placeholder="品名"><input id="newSoubaPrice" type="number" inputmode="decimal" placeholder="単価(任意)" style="max-width:110px"><button class="addBtn" onclick="addItem('souba')">追加</button></div>
      <div class="note">まとめて登録:1行に1品名。「品名,単価」の形式もOK(単価は省略可)</div>
      <textarea class="bulk" id="bulkSouba" placeholder="銅型,2132&#10;2号銅,2072&#10;上銅
